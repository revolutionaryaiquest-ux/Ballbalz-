<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookballz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--a:#ff9900;--at:color-mix(in srgb,var(--a) 62%,#000);--bg:#eef1f7;--card:#fff;--line:#dde2ee;--tx:#0f1a2e;--mut:#5b667d;--navy:#0f1b33}
*{box-sizing:border-box;margin:0}
body{background:linear-gradient(180deg,#e6ebf6 0,var(--bg) 320px);color:var(--tx);font:400 16px/1.6 Sora,system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.logo{font-family:Orbitron,Sora,sans-serif;letter-spacing:.02em}
a{color:var(--at);text-decoration:none}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 5vw;background:var(--navy);position:sticky;top:0;z-index:5;flex-wrap:wrap;box-shadow:0 2px 18px #0f1b3340}
.logo{display:flex;align-items:center;gap:10px;font-size:1.25rem;font-weight:800;color:#fff}
.logo svg{width:34px;height:34px;filter:drop-shadow(0 0 6px var(--a))}
nav{display:flex;gap:18px;font-size:.9rem}nav a{color:#c9d3f0}nav a:hover{color:var(--a)}
main{max-width:1150px;margin:0 auto;padding:24px 5vw 80px}
.hero{margin:6px 0 26px;padding:clamp(28px,6vw,64px);border-radius:20px;color:#fff;position:relative;overflow:hidden;
 background:radial-gradient(420px 260px at 88% 20%,color-mix(in srgb,var(--a) 55%,transparent),transparent),
 linear-gradient(#ffffff0d 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,#ffffff0d 1px,transparent 1px) 0 0/34px 34px,
 linear-gradient(120deg,#0f1b33,#243b7a 65%,#3a2a6b)}
.hero h1{font-size:clamp(1.8rem,5vw,3.4rem);font-weight:800;line-height:1.1;max-width:16ch}
.hero p{color:#c9d3f0;margin-top:12px;max-width:46ch}
.search{max-width:520px;margin:0 0 6px;border-radius:99px;padding:12px 20px;border:2px solid var(--line);background:#fff}
.search:focus{border-color:var(--a);outline:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:.2s;color:var(--tx)}
.card:hover{transform:translateY(-4px);border-color:var(--a);box-shadow:0 14px 34px #0f1b3322,0 0 0 3px color-mix(in srgb,var(--a) 25%,transparent)}
.cover{aspect-ratio:3/4;background:#dfe5f3 center/cover;display:grid;place-items:center;color:var(--mut)}
.card .b{padding:14px 16px 18px;display:flex;flex-direction:column;gap:5px;flex:1}
.card h3{font-size:.95rem;line-height:1.3}.muted{color:var(--mut);font-size:.9rem}
.price{font-family:Orbitron;color:#b12704;font-weight:600}
.btn{display:inline-block;background:linear-gradient(#ffb02e,var(--a));color:#111;border:1px solid color-mix(in srgb,var(--a) 70%,#000);border-radius:99px;padding:11px 24px;font:600 .95rem Sora;cursor:pointer;box-shadow:0 4px 14px color-mix(in srgb,var(--a) 35%,transparent)}
.btn:hover{filter:brightness(1.07)}.btn.ghost{background:#fff;color:var(--at);box-shadow:none}.btn.red{background:#d93b3b;color:#fff;border-color:#b52a2a;box-shadow:none}
.btn:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--at);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:20px;box-shadow:0 6px 24px #0f1b330d}
.two{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:32px;align-items:start}
@media(max-width:720px){.two{grid-template-columns:1fr}}
ul.learn{padding-left:20px;margin:10px 0}ul.learn li{margin:6px 0}
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:.85rem}
input,textarea,select{width:100%;background:#fff;color:var(--tx);border:1px solid #c9d0e0;border-radius:10px;padding:10px;font:inherit}
input:focus,textarea:focus{border-color:var(--a);outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 25%,transparent)}
textarea{min-height:90px}
.acct{border:2px dashed var(--a);background:#fffaf0;border-radius:12px;padding:14px;margin:12px 0}
.acct b{font-family:Orbitron;font-size:1.3rem;letter-spacing:.08em;color:var(--navy)}
.note{border-left:4px solid var(--a);background:#fff7e6;border-radius:0 10px 10px 0;padding:10px 16px;margin:14px 0;color:#4a4130}
details{border-bottom:1px solid var(--line);padding:14px 0}summary{cursor:pointer;font-weight:600}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:12px 0}
.tag{font-size:.75rem;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--mut)}
.tag.confirmed{color:#0a8f4d;border-color:#0a8f4d;background:#e8fff3}.tag.awaiting_confirmation{color:#a86a00;border-color:#e0a030;background:#fff6e0}
.pulse{width:14px;height:14px;border-radius:50%;background:var(--a);display:inline-block;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25;transform:scale(1.5)}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}.card{transition:none}}
h2{font-size:1.15rem;margin:34px 0 2px}
#bar{background:var(--a);color:#111;text-align:center;padding:8px 5vw;font-weight:600;font-size:.9rem}#bar:empty{display:none}#bar a{color:#111;text-decoration:underline}
.btn.sm{padding:6px 14px;font-size:.8rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 16px;cursor:pointer;font:600 .85rem Sora;color:var(--mut)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:14px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stars{color:#f5a300;letter-spacing:2px}
.share{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.wa{position:fixed;right:16px;bottom:16px;background:#25d366;color:#fff;border-radius:99px;padding:11px 18px;font:600 .9rem Sora;box-shadow:0 6px 20px #0003;z-index:9}
.wa:hover{color:#fff;filter:brightness(1.08)}
footer a{color:var(--a)}
footer{text-align:center;color:#c9d3f0;background:var(--navy);padding:30px;font-size:.85rem}
</style>
</head>
<body>
<div id="bar"></div>
<header>
  <a class="logo" href="#/">
    <svg viewBox="0 0 40 40" fill="none" stroke="var(--a)" stroke-width="2"><circle cx="20" cy="20" r="9" fill="var(--a)" fill-opacity=".3"/><ellipse cx="20" cy="20" rx="18" ry="6" transform="rotate(-25 20 20)"/><path d="M15 17h10M15 21h10M15 25h6" stroke="#fff" stroke-width="1.6"/></svg>
    <span id="brand">Bookballz</span>
  </a>
  <nav><a href="#/">Books</a><a href="#/faq">FAQ</a><a href="#/lookup">My order</a><a href="#/terms">Terms</a></nav>
</header>
<main id="app"></main>
<footer id="foot"></footer>
<a id="wa" class="wa" target="_blank" rel="noopener">💬 WhatsApp</a>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient(
  'https://ztzanusseipjrxbkmblr.supabase.co',
  'sb_publishable_sKSSn0CDCGN6HklhHb4fWg_vhh28G23'
);
const app = document.getElementById('app');
const $ = (i) => document.getElementById(i);
const v = (id) => $(id).value.trim();
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ngn = (n) => '₦' + Number(n).toLocaleString();
const stars = (n) => '★'.repeat(n) + '☆'.repeat(5 - n);
const intl = (p) => { const d = String(p || '').replace(/\D/g, ''); return d.startsWith('0') ? '234' + d.slice(1) : d; };
let S = {}, timer, cat = 'All', term = '', lastSt = '', lastRef = '';
const wa = (text) => `https://wa.me/${(S.whatsapp || '2347041988231').replace(/\D/g, '')}${text ? '?text=' + encodeURIComponent(text) : ''}`;
const api = async (path, body) => {
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch(path, { method: 'POST', headers: { Authorization: 'Bearer ' + (session?.access_token || '') }, body: JSON.stringify(body) });
  return r.json();
};

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  const t = b.dataset.copy, old = b.textContent;
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
    .then(() => { b.textContent = 'Copied'; setTimeout(() => (b.textContent = old), 1500); })
    .catch(() => prompt('Copy this:', t));
});

async function loadSettings() {
  const { data } = await sb.from('settings').select('*');
  S = Object.fromEntries((data || []).map((r) => [r.key, r.value]));
  document.documentElement.style.setProperty('--a', S.accent || '#ff9900');
  $('brand').textContent = S.site_name || 'Bookballz';
  document.title = S.site_name || 'Bookballz';
  $('bar').innerHTML = S.announcement
    ? S.announcement_link ? `<a href="${esc(S.announcement_link)}" target="_blank" rel="noopener">${esc(S.announcement)}</a>` : esc(S.announcement)
    : '';
  $('wa').href = wa('Hi Yung dune, I have a question about ' + (S.site_name || 'Bookballz') + '.');
  $('foot').innerHTML = `${esc(S.site_name)} · ${esc(S.tagline)} · <a href="${wa()}" target="_blank" rel="noopener" style="color:var(--a)">WhatsApp</a> · ${esc(S.contact)}`;
}

/* ---------- PUBLIC PAGES ---------- */
const card = (b) => `<a class="card" href="#/book/${b.id}">
  <div class="cover" style="${b.cover_url ? `background-image:url('${esc(b.cover_url)}')` : ''}">${b.cover_url ? '' : 'No cover'}</div>
  <div class="b">${b.category ? `<span class="tag" style="align-self:flex-start">${esc(b.category)}</span>` : ''}<h3>${esc(b.title)}</h3><span class="muted">${esc(b.subtitle)}</span>
  <span class="muted">${esc((b.learn || []).slice(0, 2).join(' · '))}</span>
  <span class="price" style="margin-top:auto">${ngn(b.price)}</span></div></a>`;

async function home() {
  const [{ data: books }, { data: notes }, { data: revs }] = await Promise.all([
    sb.from('books').select('*').eq('published', true).order('sort').order('created_at', { ascending: false }),
    sb.from('notes').select('*').order('created_at', { ascending: false }).limit(3),
    sb.from('reviews').select('*,books(title)').eq('approved', true).order('created_at', { ascending: false }).limit(3),
  ]);
  const all = books || [];
  const cats = ['All', ...new Set(all.map((b) => b.category).filter(Boolean))];
  if (!cats.includes(cat)) cat = 'All';
  app.innerHTML = `<section class="hero"><h1>${esc(S.hero)}</h1><p>${esc(S.tagline)}</p></section>
  ${(notes || []).map((n) => `<div class="note">${esc(n.body)}</div>`).join('')}
  <input class="search" id="q" placeholder="Search books…" aria-label="Search books" value="${esc(term)}">
  <div class="chips" id="chips">${cats.map((c) => `<button class="chip ${c === cat ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  <div id="feat"></div><h2 id="ttl">All books</h2><div class="grid" id="grid"></div>
  ${(revs || []).length ? `<h2>What readers say</h2><div class="g3">${revs.map((r) => `<div class="rcard"><span class="stars">${stars(r.rating)}</span><p style="margin:6px 0">${esc(r.body)}</p><span class="muted">${esc(r.name)} on ${esc(r.books?.title)}</span></div>`).join('')}</div>` : ''}`;
  const draw = () => {
    const t = term.toLowerCase();
    const list = all.filter((b) => (cat === 'All' || b.category === cat) && (!t || [b.title, b.subtitle, b.category, ...(b.learn || [])].join(' ').toLowerCase().includes(t)));
    const feat = all.filter((b) => b.featured);
    $('feat').innerHTML = feat.length && cat === 'All' && !t ? `<h2>Featured</h2><div class="grid">${feat.map(card).join('')}</div>` : '';
    $('ttl').textContent = cat === 'All' ? 'All books' : cat;
    $('grid').innerHTML = list.map(card).join('') || '<p class="muted">No books match. Try another section or search.</p>';
  };
  $('q').oninput = (e) => { term = e.target.value; draw(); };
  $('chips').onclick = (e) => {
    const b = e.target.closest('[data-c]'); if (!b) return;
    cat = b.dataset.c;
    document.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x.dataset.c === cat));
    draw();
  };
  draw();
}

async function book(id) {
  const [{ data: b }, { data: revs }] = await Promise.all([
    sb.from('books').select('*').eq('id', id).single(),
    sb.from('reviews').select('*').eq('book_id', id).eq('approved', true).order('created_at', { ascending: false }),
  ]);
  if (!b) return (app.innerHTML = '<p>Book not found.</p>');
  let rel = [];
  if (b.category) rel = (await sb.from('books').select('*').eq('published', true).eq('category', b.category).neq('id', id).limit(4)).data || [];
  if (!rel.length) rel = (await sb.from('books').select('*').eq('published', true).neq('id', id).order('created_at', { ascending: false }).limit(4)).data || [];
  const rv = revs || [], avg = rv.length ? rv.reduce((s, r) => s + r.rating, 0) / rv.length : 0;
  const url = `${location.origin}/b/${id}`, msg = `${b.title} on ${S.site_name || 'Bookballz'}`, enc = encodeURIComponent;
  app.innerHTML = `<div class="two"><div class="cover card" style="${b.cover_url ? `background-image:url('${esc(b.cover_url)}')` : ''}"></div>
  <div>${b.category ? `<span class="tag">${esc(b.category)}</span>` : ''}<h1 style="margin-top:6px">${esc(b.title)}</h1>
  <p class="muted">${esc(b.subtitle)} · by ${esc(b.author)}</p>
  ${rv.length ? `<p><span class="stars">${stars(Math.round(avg))}</span> <span class="muted">${avg.toFixed(1)} (${rv.length} review${rv.length > 1 ? 's' : ''})</span></p>` : ''}
  <p style="margin:16px 0;white-space:pre-line">${esc(b.description)}</p>
  <h3>What you'll learn</h3><ul class="learn">${(b.learn || []).map((l) => `<li>${esc(l)}</li>`).join('')}</ul>
  <p class="price" style="font-size:1.6rem;margin:16px 0">${ngn(b.price)}</p>
  <a class="btn" href="#/checkout/${b.id}">Buy this book</a>
  <div class="share"><span class="muted" style="align-self:center">Share:</span>
    <a class="btn ghost sm" target="_blank" rel="noopener" href="https://wa.me/?text=${enc(msg + ' ' + url)}">WhatsApp</a>
    <a class="btn ghost sm" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=${enc(msg)}&url=${enc(url)}">X</a>
    <a class="btn ghost sm" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${enc(url)}">Facebook</a>
    <a class="btn ghost sm" target="_blank" rel="noopener" href="https://t.me/share/url?url=${enc(url)}&text=${enc(msg)}">Telegram</a>
    <button class="btn ghost sm" data-copy="${esc(url)}">Copy link</button>
    ${navigator.share ? '<button class="btn ghost sm" id="ns">More…</button>' : ''}</div></div></div>
  <h2>Reviews</h2>
  ${rv.map((r) => `<div class="rcard" style="margin-top:12px"><span class="stars">${stars(r.rating)}</span> <b>${esc(r.name)}</b><p style="margin-top:4px">${esc(r.body)}</p></div>`).join('') || '<p class="muted">No reviews yet. Be the first.</p>'}
  <div class="panel"><h3>Write a review</h3><label>Your name</label><input id="rn" maxlength="60">
  <label>Rating</label><select id="rr"><option value="5">★★★★★ Excellent</option><option value="4">★★★★☆ Good</option><option value="3">★★★☆☆ Okay</option><option value="2">★★☆☆☆ Poor</option><option value="1">★☆☆☆☆ Bad</option></select>
  <label>Your review</label><textarea id="rb" maxlength="600"></textarea><input id="hp" style="display:none" tabindex="-1" autocomplete="off">
  <button class="btn" id="rs" style="margin-top:12px">Submit review</button> <span id="rm" class="muted"></span></div>
  ${rel.length ? `<h2>${b.category ? 'More in ' + esc(b.category) : 'You might also like'}</h2><div class="grid">${rel.map(card).join('')}</div>` : ''}`;
  if ($('ns')) $('ns').onclick = () => navigator.share({ title: b.title, text: msg, url }).catch(() => {});
  $('rs').onclick = async () => {
    const name = v('rn'), body = v('rb'), m = $('rm');
    if (!name || body.length < 5) return (m.textContent = 'Add your name and a review of at least 5 characters.');
    if (v('hp')) return (m.textContent = 'Thanks! Your review will show after approval.');
    const { error } = await sb.from('reviews').insert({ book_id: id, name, rating: +$('rr').value, body });
    if (error) return (m.textContent = 'Could not send. Try again.');
    $('rn').value = $('rb').value = '';
    m.textContent = 'Thanks! Your review will show after approval.';
  };
}

async function checkout(id) {
  const { data: b } = await sb.from('books').select('title,price').eq('id', id).single();
  if (!b) return (app.innerHTML = '<p>Book not found.</p>');
  app.innerHTML = `<h1>Checkout</h1><div class="panel"><h3>${esc(b.title)}</h3><p class="price">${ngn(b.price)}</p>
  <label>Full name</label><input id="n"><label>Email (your download is tied to it)</label><input id="e" type="email">
  <label>WhatsApp number</label><input id="p"><p class="muted" style="margin-top:12px">Payment is by bank transfer. No refunds on digital products.</p>
  <button class="btn" id="go" style="margin-top:14px">Continue to payment</button><p id="err" style="color:#d93b3b"></p></div>`;
  $('go').onclick = async () => {
    const n = v('n'), e = v('e'), p = v('p');
    if (!n || !/.+@.+\..+/.test(e) || !p) return ($('err').textContent = 'Fill in all three fields with a valid email.');
    const { data: ref, error } = await sb.rpc('create_order', { p_book: id, p_name: n, p_email: e, p_phone: p });
    if (error) return ($('err').textContent = error.message);
    localStorage.setItem('bb_' + ref, e.trim().toLowerCase());
    location.hash = '#/order/' + ref;
  };
}

async function getOrder(ref) {
  const email = localStorage.getItem('bb_' + ref);
  if (!email) return { status: 'noemail' };
  const r = await fetch('/api/order', { method: 'POST', body: JSON.stringify({ ref, email }) });
  return r.json();
}

function bindReceipt(ref) {
  if (!$('ru')) return;
  $('ru').onclick = async () => {
    const f = $('rf').files[0], m = $('rm');
    if (!f) return (m.textContent = 'Choose a file first.');
    if (f.size > 5 * 1024 * 1024) return (m.textContent = 'File is over 5 MB.');
    m.textContent = 'Uploading…';
    const path = `${ref}-${Date.now()}.${(f.name.split('.').pop() || 'jpg').toLowerCase()}`;
    const u = await sb.storage.from('receipts').upload(path, f);
    if (u.error) return (m.textContent = u.error.message);
    const { error } = await sb.rpc('set_receipt', { p_ref: ref, p_email: localStorage.getItem('bb_' + ref), p_path: path });
    m.textContent = error ? error.message : 'Receipt sent. Thank you!';
  };
}

async function order(ref) {
  const o = await getOrder(ref);
  if (o.status === 'awaiting_confirmation' && lastSt === o.status && lastRef === ref) {
    timer = setTimeout(() => location.hash.includes(ref) && order(ref), 4000);
    return;
  }
  lastSt = o.status; lastRef = ref;
  const email = localStorage.getItem('bb_' + ref) || '';
  const help = `<p class="muted" style="margin-top:16px">Need help? <a href="${wa('Hi Yung dune, I need help with order ' + ref)}" target="_blank" rel="noopener">Chat on WhatsApp</a></p>`;
  const rbox = `<div class="panel"><h3>Upload proof of payment (optional)</h3><p class="muted">You don't have to. It just helps us confirm faster.</p>
    <input id="rf" type="file" accept="image/*,application/pdf" style="margin-top:8px"><button class="btn ghost" id="ru" style="margin-top:10px">Upload receipt</button> <span id="rm" class="muted"></span></div>`;
  const banks = [[S.bank_name, S.account_name, S.account_number], [S.bank2_name, S.bank2_account_name, S.bank2_number]]
    .filter((x) => x[2]).map((x) => `<div class="acct"><span class="muted">${esc(x[0])}</span><br><b>${esc(x[2])}</b> <button class="btn ghost sm" data-copy="${esc(x[2])}">Copy</button><br>${esc(x[1])}</div>`).join('');

  if (o.status === 'noemail' || o.status === 'notfound') {
    app.innerHTML = `<h1>Find your order</h1><p class="muted">Enter the email you used for ${esc(ref)}.</p><div class="panel"><input id="e" type="email"><button class="btn" id="go" style="margin-top:12px">Open order</button></div>`;
    $('go').onclick = () => { localStorage.setItem('bb_' + ref, v('e').toLowerCase()); lastSt = ''; order(ref); };
  } else if (o.status === 'pending') {
    app.innerHTML = `<h1>Pay ${ngn(o.amount)}</h1><p class="muted">${esc(o.title)}</p>
    <div class="panel"><p>Amount: <b>${ngn(o.amount)}</b> <button class="btn ghost sm" data-copy="${esc(o.amount)}">Copy</button></p>
    <p>Reference: <b>${esc(ref)}</b> <button class="btn ghost sm" data-copy="${esc(ref)}">Copy</button></p>${banks}
    <p class="muted">Put the reference in the transfer narration/remark. Your order expires in 24 hours.</p>
    <button class="btn" id="sent" style="margin-top:14px">I've sent the money</button></div>${rbox}${help}`;
    bindReceipt(ref);
    $('sent').onclick = async () => {
      await sb.rpc('mark_sent', { p_ref: ref, p_email: email });
      fetch('/api/notify', { method: 'POST', body: JSON.stringify({ ref, email }) });
      lastSt = ''; order(ref);
    };
  } else if (o.status === 'awaiting_confirmation') {
    app.innerHTML = `<h1><span class="pulse"></span> Waiting for confirmation</h1><p class="muted">Order ${esc(ref)}. This page updates by itself once the payment is confirmed. You can close it and return via "My order".</p>${rbox}${help}`;
    bindReceipt(ref);
    timer = setTimeout(() => location.hash.includes(ref) && order(ref), 4000);
  } else if (o.status === 'confirmed') {
    const link = `${location.origin}/#/order/${ref}`;
    app.innerHTML = `<h1>Payment confirmed</h1><div class="panel"><h3>${esc(o.title)}</h3><p class="muted">Your download link works for 5 minutes. Come back to "My order" any time for a new one.</p>
    ${o.url ? `<a class="btn" href="${esc(o.url)}" download style="margin-top:12px">Download PDF</a>` : '<p>File not ready. Contact support.</p>'}
    <p style="margin-top:14px"><a class="btn ghost sm" href="mailto:${esc(email)}?subject=${encodeURIComponent('My order ' + ref)}&body=${encodeURIComponent('Open this link and enter your email to download: ' + link)}">Email this link to myself</a></p></div>${help}`;
  } else app.innerHTML = `<h1>Order ${esc(o.status)}</h1><p class="muted">If you already paid, message us with reference ${esc(ref)}.</p>${help}`;
}

function lookup() {
  app.innerHTML = `<h1>My order</h1><div class="panel"><label>Order reference (e.g. BB-12345)</label><input id="r"><label>Email</label><input id="e" type="email">
  <button class="btn" id="go" style="margin-top:14px">Open order</button></div>`;
  $('go').onclick = () => { const r = v('r').toUpperCase(); localStorage.setItem('bb_' + r, v('e').toLowerCase()); lastSt = ''; location.hash = '#/order/' + r; };
}

async function faq() {
  const { data } = await sb.from('faq').select('*').order('sort');
  app.innerHTML = `<h1>FAQ</h1>${(data || []).map((f) => `<details><summary>${esc(f.q)}</summary><p class="muted" style="margin-top:8px">${esc(f.a)}</p></details>`).join('') || '<p class="muted">No questions yet.</p>'}`;
}
const terms = () => (app.innerHTML = `<h1>Terms</h1><p style="margin-top:14px;white-space:pre-line">${esc(S.terms)}</p>`);

/* ---------- ADMIN ---------- */
const FIELDS = ['announcement', 'announcement_link', 'whatsapp', 'site_name', 'tagline', 'hero', 'accent', 'bank_name', 'account_name', 'account_number', 'bank2_name', 'bank2_account_name', 'bank2_number', 'contact', 'terms'];
const TABS = ['orders', 'books', 'reviews', 'buyers', 'faq', 'notes', 'settings', 'telegram', 'email'];
let tab = 'orders', oData = [], ofilter = 'all', oq = '';

async function admin() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    app.innerHTML = `<h1>Admin</h1><div class="panel"><label>Email</label><input id="e" type="email"><label>Password</label><input id="p" type="password">
    <button class="btn" id="go" style="margin-top:14px">Log in</button><p id="err" style="color:#d93b3b"></p></div>`;
    $('go').onclick = async () => {
      const { error } = await sb.auth.signInWithPassword({ email: v('e'), password: $('p').value });
      error ? ($('err').textContent = error.message) : admin();
    };
    return;
  }
  app.innerHTML = `<h1>Admin</h1><div class="tabs">${TABS.map((t) => `<button class="btn sm ${t === tab ? '' : 'ghost'}" data-t="${t}">${t}</button>`).join('')}
  <button class="btn red sm" id="out">Log out</button></div><div id="pane"></div>`;
  app.querySelectorAll('[data-t]').forEach((b) => (b.onclick = () => { tab = b.dataset.t; admin(); }));
  $('out').onclick = async () => { await sb.auth.signOut(); admin(); };
  ({ orders: aOrders, books: aBooks, reviews: aReviews, buyers: aBuyers, faq: aFaq, notes: aNotes, settings: aSettings, telegram: aTelegram, email: aEmail })[tab]();
}

async function aOrders() {
  $('pane').innerHTML = `<div class="tabs">${['all', 'pending', 'awaiting_confirmation', 'confirmed', 'rejected'].map((f) => `<button class="btn sm ${f === ofilter ? '' : 'ghost'}" data-f="${f}">${f.replace('_', ' ')}</button>`).join('')}</div>
  <input id="oqi" placeholder="Search reference, name or email" value="${esc(oq)}"><p id="ost" class="muted"></p><div id="olist"></div>`;
  $('oqi').oninput = (e) => { oq = e.target.value; drawOrders(); };
  document.querySelectorAll('[data-f]').forEach((b) => (b.onclick = () => { ofilter = b.dataset.f; aOrders(); }));
  loadOrders();
}
async function loadOrders() {
  const { data } = await sb.from('orders').select('*,books(title)').order('created_at', { ascending: false });
  oData = data || [];
  drawOrders();
  clearTimeout(timer);
  timer = setTimeout(() => tab === 'orders' && location.hash === '#/admin' && loadOrders(), 10000);
}
function drawOrders() {
  if (!$('olist')) return;
  const q = oq.toLowerCase();
  const list = oData.filter((o) => (ofilter === 'all' || o.status === ofilter) && (!q || [o.ref, o.name, o.email].join(' ').toLowerCase().includes(q)));
  $('olist').innerHTML = list.map((o) => `<div class="row"><div><b>${esc(o.ref)}</b> <span class="tag ${o.status}">${o.status.replace('_', ' ')}</span><br>
  <span class="muted">${esc(o.name)} · ${esc(o.email)} · ${esc(o.phone)}<br>${esc(o.books?.title)} · ${ngn(o.amount)} · ${new Date(o.created_at).toLocaleString()}</span></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">${o.receipt_path ? `<button class="btn ghost sm" data-v="${o.id}">View receipt</button>` : ''}
  <a class="btn ghost sm" target="_blank" rel="noopener" href="https://wa.me/${intl(o.phone)}">WhatsApp</a>
  ${['pending', 'awaiting_confirmation'].includes(o.status) ? `<button class="btn sm" data-c="${o.id}">Confirm</button> <button class="btn red sm" data-r="${o.id}">Reject</button>` : ''}</div></div>`).join('') || '<p class="muted">No orders here.</p>';
  const set = async (id, status) => {
    await sb.from('orders').update({ status, confirmed_at: status === 'confirmed' ? new Date() : null }).eq('id', id);
    if (status === 'confirmed') {
      const r = await api('/api/email-order', { id });
      $('ost') && ($('ost').textContent = r.ok ? 'Confirmed. Download link emailed to the buyer.' : 'Confirmed. Email not sent: ' + (r.error || 'unknown error'));
    }
    loadOrders();
  };
  document.querySelectorAll('[data-c]').forEach((b) => (b.onclick = () => set(b.dataset.c, 'confirmed')));
  document.querySelectorAll('[data-r]').forEach((b) => (b.onclick = () => set(b.dataset.r, 'rejected')));
  document.querySelectorAll('[data-v]').forEach((b) => (b.onclick = async () => {
    const w = window.open('', '_blank');
    const o = oData.find((x) => x.id === b.dataset.v);
    const { data, error } = await sb.storage.from('receipts').createSignedUrl(o.receipt_path, 300);
    if (error) { w && w.close(); return alert(error.message); }
    w ? (w.location = data.signedUrl) : (location.href = data.signedUrl);
  }));
}

async function aBooks(edit) {
  const { data } = await sb.from('books').select('*').order('sort');
  const b = edit || {};
  const cats = [...new Set((data || []).map((x) => x.category).filter(Boolean))];
  $('pane').innerHTML = `<div class="panel"><h3>${b.id ? 'Edit' : 'Add'} book</h3>
  <label>Title</label><input id="t" value="${esc(b.title)}"><label>Subtitle</label><input id="s" value="${esc(b.subtitle)}">
  <label>Author</label><input id="a" value="${esc(b.author)}"><label>Price (₦)</label><input id="pr" type="number" value="${b.price ?? ''}">
  <label>Category / section (books with the same category show as related)</label><input id="cg" list="cl" value="${esc(b.category)}"><datalist id="cl">${cats.map((c) => `<option value="${esc(c)}">`).join('')}</datalist>
  <label>Description</label><textarea id="d">${esc(b.description)}</textarea>
  <label>What you'll learn (one per line)</label><textarea id="l">${esc((b.learn || []).join('\n'))}</textarea>
  <label>Sort order (small number shows first)</label><input id="so" type="number" value="${b.sort ?? 0}">
  <label>Cover image ${b.cover_url ? '(leave empty to keep current)' : ''}</label><input id="cf" type="file" accept="image/*">
  <label>PDF ${b.pdf_path ? '(leave empty to keep current)' : ''}</label><input id="pf" type="file" accept="application/pdf">
  <label><input type="checkbox" id="pub" style="width:auto" ${b.published ? 'checked' : ''}> Published</label>
  <label><input type="checkbox" id="ft" style="width:auto" ${b.featured ? 'checked' : ''}> Featured on the home page</label>
  <button class="btn" id="save" style="margin-top:12px">Save book</button> <span id="st" class="muted"></span></div>
  ${(data || []).map((x) => `<div class="row"><span>${esc(x.title)} · ${ngn(x.price)} ${x.category ? `<span class="tag">${esc(x.category)}</span>` : ''} ${x.published ? '' : '<span class="tag">draft</span>'}</span>
  <span><button class="btn ghost sm" data-e="${x.id}">Edit</button> <button class="btn red sm" data-d="${x.id}">Delete</button></span></div>`).join('')}`;
  document.querySelectorAll('[data-e]').forEach((x) => (x.onclick = () => { aBooks(data.find((r) => r.id === x.dataset.e)); scrollTo(0, 0); }));
  document.querySelectorAll('[data-d]').forEach((x) => (x.onclick = () => confirm('Delete this book?') && sb.from('books').delete().eq('id', x.dataset.d).then(() => aBooks())));
  $('save').onclick = async () => {
    const st = $('st'); st.textContent = 'Saving…';
    const row = { title: v('t'), subtitle: v('s'), author: v('a'), price: +v('pr') || 0, category: v('cg') || null, description: v('d'), sort: +v('so') || 0,
      learn: v('l').split('\n').map((x) => x.trim()).filter(Boolean), published: $('pub').checked, featured: $('ft').checked };
    const cf = $('cf').files[0], pf = $('pf').files[0];
    if (cf) { const p = Date.now() + '-' + cf.name.replace(/\s/g, '_'); const u = await sb.storage.from('covers').upload(p, cf); if (u.error) return (st.textContent = u.error.message); row.cover_url = sb.storage.from('covers').getPublicUrl(p).data.publicUrl; }
    if (pf) { const p = Date.now() + '-' + pf.name.replace(/\s/g, '_'); const u = await sb.storage.from('pdfs').upload(p, pf); if (u.error) return (st.textContent = u.error.message); row.pdf_path = p; }
    const { error } = await (b.id ? sb.from('books').update(row).eq('id', b.id) : sb.from('books').insert(row));
    error ? (st.textContent = error.message) : aBooks();
  };
}

async function aReviews() {
  const { data } = await sb.from('reviews').select('*,books(title)').order('approved').order('created_at', { ascending: false });
  $('pane').innerHTML = (data || []).map((r) => `<div class="row"><div><span class="stars">${stars(r.rating)}</span> <b>${esc(r.name)}</b> <span class="tag ${r.approved ? 'confirmed' : 'awaiting_confirmation'}">${r.approved ? 'showing' : 'pending'}</span>
  <br><span class="muted">${esc(r.books?.title)} · ${new Date(r.created_at).toLocaleDateString()}</span><br>${esc(r.body)}</div>
  <div>${r.approved ? `<button class="btn ghost sm" data-h="${r.id}">Hide</button>` : `<button class="btn sm" data-a="${r.id}">Approve</button>`} <button class="btn red sm" data-d="${r.id}">Delete</button></div></div>`).join('') || '<p class="muted">No reviews yet. They appear here for approval before showing on the site.</p>';
  const up = (id, approved) => sb.from('reviews').update({ approved }).eq('id', id).then(aReviews);
  document.querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => up(b.dataset.a, true)));
  document.querySelectorAll('[data-h]').forEach((b) => (b.onclick = () => up(b.dataset.h, false)));
  document.querySelectorAll('[data-d]').forEach((b) => (b.onclick = () => sb.from('reviews').delete().eq('id', b.dataset.d).then(aReviews)));
}

function downloadCsv(name, rows) {
  const q = (x) => '"' + String(x ?? '').replace(/"/g, '""') + '"';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rows.map((r) => r.map(q).join(',')).join('\n')], { type: 'text/csv' }));
  a.download = name; a.click();
}

async function aBuyers() {
  const { data } = await sb.from('orders').select('*,books(title)').order('created_at', { ascending: false });
  const m = {};
  (data || []).forEach((o) => {
    const x = (m[o.email] = m[o.email] || { name: o.name, email: o.email, phone: o.phone, paid: 0, spent: 0, books: new Set() });
    if (o.status === 'confirmed') { x.paid++; x.spent += Number(o.amount); x.books.add(o.books?.title); }
  });
  const all = Object.values(m), buyers = all.filter((x) => x.paid), leads = all.filter((x) => !x.paid);
  const row = (x) => `<div class="row"><div><b>${esc(x.name)}</b><br><span class="muted">${esc(x.email)} · ${esc(x.phone)}</span>
  ${x.paid ? `<br><span class="muted">${[...x.books].map(esc).join(', ')} · ${ngn(x.spent)}</span>` : ''}</div>
  <a class="btn ghost sm" target="_blank" rel="noopener" href="https://wa.me/${intl(x.phone)}">WhatsApp</a></div>`;
  $('pane').innerHTML = `<div class="panel"><h3>Buyers (${buyers.length})</h3><p class="muted">People with at least one confirmed payment. Total: ${ngn(buyers.reduce((s, x) => s + x.spent, 0))}</p>
  <button class="btn ghost sm" id="ex" style="margin-top:8px">Export CSV</button>${buyers.map(row).join('') || '<p class="muted" style="margin-top:10px">No buyers yet.</p>'}</div>
  <div class="panel"><h3>Leads (${leads.length})</h3><p class="muted">Gave their details at checkout but have not paid. Follow up on WhatsApp.</p>${leads.map(row).join('') || '<p class="muted">None.</p>'}</div>`;
  $('ex').onclick = () => downloadCsv('buyers.csv', [['Name', 'Email', 'Phone', 'Books', 'Total spent'], ...buyers.map((x) => [x.name, x.email, x.phone, [...x.books].join('; '), x.spent])]);
}

async function aFaq() {
  const { data } = await sb.from('faq').select('*').order('sort');
  $('pane').innerHTML = `<div class="panel"><label>Question</label><input id="q"><label>Answer</label><textarea id="a"></textarea>
  <label>Sort order</label><input id="so" type="number" value="0"><button class="btn" id="add" style="margin-top:12px">Add FAQ</button></div>
  ${(data || []).map((f) => `<div class="row"><span><b>${esc(f.q)}</b><br><span class="muted">${esc(f.a)}</span></span><button class="btn red sm" data-d="${f.id}">Delete</button></div>`).join('')}`;
  $('add').onclick = () => sb.from('faq').insert({ q: v('q'), a: v('a'), sort: +v('so') || 0 }).then(aFaq);
  document.querySelectorAll('[data-d]').forEach((x) => (x.onclick = () => sb.from('faq').delete().eq('id', x.dataset.d).then(aFaq)));
}

async function aNotes() {
  const { data } = await sb.from('notes').select('*').order('created_at', { ascending: false });
  $('pane').innerHTML = `<div class="panel"><label>Note from the owner (shows on the home page)</label><textarea id="b"></textarea><button class="btn" id="add" style="margin-top:12px">Post note</button></div>
  ${(data || []).map((n) => `<div class="row"><span>${esc(n.body)}</span><button class="btn red sm" data-d="${n.id}">Delete</button></div>`).join('')}`;
  $('add').onclick = () => v('b') && sb.from('notes').insert({ body: v('b') }).then(aNotes);
  document.querySelectorAll('[data-d]').forEach((x) => (x.onclick = () => sb.from('notes').delete().eq('id', x.dataset.d).then(aNotes)));
}

async function aSettings() {
  $('pane').innerHTML = `<div class="panel"><p class="muted">Announcement bar: type a message to show a banner at the top of every page. Leave it empty to hide it.</p>
  ${FIELDS.map((k) => `<label>${k}</label>${k === 'terms' ? `<textarea data-k="${k}">${esc(S[k])}</textarea>` : `<input data-k="${k}" value="${esc(S[k])}">`}`).join('')}
  <button class="btn" id="save" style="margin-top:14px">Save settings</button> <span id="st" class="muted"></span></div>`;
  $('save').onclick = async () => {
    const rows = [...document.querySelectorAll('[data-k]')].map((i) => ({ key: i.dataset.k, value: i.value }));
    const { error } = await sb.from('settings').upsert(rows);
    $('st').textContent = error ? error.message : 'Saved';
    await loadSettings();
  };
}

async function secretsPanel(title, intro, fields, actions) {
  const { data } = await sb.from('app_secrets').select('*');
  const g = Object.fromEntries((data || []).map((r) => [r.key, r.value]));
  $('pane').innerHTML = `<div class="panel"><h3>${title}</h3><p class="muted" style="margin:8px 0">${intro}</p>
  ${fields.map(([k, label, type]) => `<label>${label}</label><input id="f_${k}" type="${type}" autocomplete="off" value="${esc(g[k])}">`).join('')}
  <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">${actions.map(([id, label, cls]) => `<button class="btn ${cls}" id="${id}">${label}</button>`).join('')}</div>
  <p id="st" class="muted" style="margin-top:10px"></p></div>`;
  $('save').onclick = async () => {
    const { error } = await sb.from('app_secrets').upsert(fields.map(([k]) => ({ key: k, value: v('f_' + k) })));
    $('st').textContent = error ? error.message : 'Saved. Now press the test button.';
  };
}

async function aTelegram() {
  await secretsPanel('Telegram alerts',
    '1) In Telegram open @BotFather, send /newbot, copy the token. 2) Open your new bot and send it any message, like "hi". 3) Paste the token and press Find my chat ID. 4) Save, then Send test message.',
    [['tg_token', 'Bot token', 'password'], ['tg_chat', 'Chat ID', 'text']],
    [['find', 'Find my chat ID', 'ghost'], ['save', 'Save', ''], ['test', 'Send test message', 'ghost']]);
  $('find').onclick = async () => {
    $('st').textContent = 'Looking…';
    const r = await api('/api/tg-find', { token: v('f_tg_token') });
    if (r.chat_id) { $('f_tg_chat').value = r.chat_id; $('st').textContent = 'Found your chat (' + r.name + '). Press Save.'; } else $('st').textContent = r.error || 'Not found.';
  };
  $('test').onclick = async () => { $('st').textContent = 'Sending…'; const r = await api('/api/tg-test', {}); $('st').textContent = r.ok ? 'Sent. Check Telegram.' : r.error || 'Failed.'; };
}

async function aEmail() {
  await secretsPanel('Email delivery (Resend)',
    'When you press Confirm, the buyer is emailed a link to their download page. Create a free account at resend.com, make an API key, then paste it here. The "From" address must belong to a domain you verified in Resend, for example Bookballz <orders@yourdomain.com>. Until you verify a domain, Resend only delivers to your own email, so buyers use the "Email this link to myself" button on their page instead.',
    [['resend_key', 'Resend API key', 'password'], ['mail_from', 'From address', 'text']],
    [['save', 'Save', ''], ['test', 'Send test email to me', 'ghost']]);
  $('test').onclick = async () => { $('st').textContent = 'Sending…'; const r = await api('/api/email-test', {}); $('st').textContent = r.ok ? 'Sent. Check your inbox.' : r.error || 'Failed.'; };
}

/* ---------- ROUTER ---------- */
const R = { '': home, book, checkout, order, lookup, faq, terms, admin };
async function route() {
  clearTimeout(timer);
  const [p, id] = location.hash.replace(/^#\/?/, '').split('/');
  await (R[p] || home)(id);
  scrollTo(0, 0);
}
addEventListener('hashchange', route);
loadSettings().then(route);

</script>
</body>
</html>
